[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[project]
name = "centaur-metrics"
version = "0.1.0"
description = "Inter-annotator agreement metrics for Label Studio annotation projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "krippendorff>=0.8.1",
    "label-studio-sdk>=2.0.11",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pydantic==2.12",
    "python-dotenv>=1.1.1",
    "statsmodels>=0.14.5",
    "streamlit>=1.52.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
